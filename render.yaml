# Render Blueprint Configuration
# Docs: https://render.com/docs/blueprint-spec

services:
  # Unified All-in-One Web Service (Recommended for Render Free Tier)
  - type: web
    name: hr-management-system
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api-proxy/health
    envVars:
      - key: PORT
        value: "10000"
      - key: BACKEND_PORT
        value: "4000"
      - key: DB_HOST
        value: "sql12.freesqldatabase.com"
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: "sql12840265"
      - key: DB_USER
        value: "sql12840265"
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "false"
